apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spring-boot-auth-ingress
  namespace: spring-boot-auth
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  ingressClassName: "nginx"
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: spring-boot-auth-service
            port:
              number: 8080
